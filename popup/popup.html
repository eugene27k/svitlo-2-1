<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Черга 2.1</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Черга 2.1</h1>
    <!-- Ряд іконок (мінімалізм): дії без тексту, значення — у підказках title при наведенні.
         Іконки — stroke="currentColor", тому колір бере з --text і працює в обох темах. -->
    <nav class="toolbar" aria-label="Дії">
      <button id="refresh" aria-label="Оновити зараз">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.6 8a5.6 5.6 0 1 1-1.64-3.96"/><path d="M13.9 1.6v3h-3"/></svg>
      </button>
      <button id="copy-report" aria-label="Скопіювати звіт для налагодження">
        <svg class="icon-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.2"/><path d="M10.5 3.5h-7a1 1 0 0 0-1 1v7"/></svg>
        <svg class="icon-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5"/></svg>
      </button>
      <button id="test-notification" aria-label="Надіслати тестове сповіщення">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2a3.8 3.8 0 0 1 3.8 3.8c0 2.9.7 3.8 1.4 4.5H2.8c.7-.7 1.4-1.6 1.4-4.5A3.8 3.8 0 0 1 8 2z"/><path d="M6.6 13.3a1.5 1.5 0 0 0 2.8 0"/></svg>
      </button>
      <button id="test-sounds" aria-label="Прослухати звуки зон">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6v4h2.4L9 13.2V2.8L4.9 6H2.5z"/><path d="M11 5.6a3.4 3.4 0 0 1 0 4.8"/><path d="M12.9 3.7a6.1 6.1 0 0 1 0 8.6"/></svg>
      </button>
      <a id="open-site" href="https://off.energy.mk.ua/" target="_blank" rel="noopener" aria-label="Відкрити сайт обленерго">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h4v4"/><path d="M13 3L7.5 8.5"/><path d="M12.5 9.5v3a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3"/></svg>
      </a>
      <button id="theme-toggle" data-mode="system" title="Тема: як у системі (клацніть — світла)" aria-label="Тема: як у системі (клацніть — світла)">
        <svg class="theme-icon icon-system" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.6" width="12.4" height="8.6" rx="1.2"/><path d="M8 11.2v2.3M5.4 13.5h5.2"/></svg>
        <svg class="theme-icon icon-light" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg>
        <svg class="theme-icon icon-dark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13 10.2A6 6 0 1 1 5.8 3a4.8 4.8 0 0 0 7.2 7.2z"/></svg>
      </button>
    </nav>
  </header>

  <section class="zone">
    <div id="current" class="current">Зараз: …</div>
    <div id="next" class="next"></div>
    <div id="unknown-types" class="note hidden"></div>
    <div id="notifications-denied" class="note warn hidden">Сповіщення вимкнені — розширення не зможе попереджати</div>
  </section>

  <section>
    <h2 id="today-title">Сьогодні</h2>
    <div id="tl-today" class="timeline"></div>
    <ul id="today" class="segments"></ul>
    <h2 id="tomorrow-title">Завтра</h2>
    <div id="tl-tomorrow" class="timeline"></div>
    <ul id="tomorrow" class="segments"></ul>
  </section>

  <section class="meta">
    <div id="updated"></div>
    <div id="verify"></div>
    <div id="checks-line"></div>
    <ul id="checks-list" class="checks hidden"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
